name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 先直接跑測試，讓失敗清單出現在 job log；再由 accept.sh 跑靜態驗收。
      - run: npm run typecheck
      - run: npm test
      - name: Static acceptance
        run: COMPASS_ACCEPT_SKIP_ENV=1 bash scripts/accept.sh
